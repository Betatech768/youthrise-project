{%load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Registrations</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
    />
    <link rel="stylesheet" href="{% static 'css/admincss.css' %}" />
  </head>
  <body>
    <!-- Navbar start -->
    <div class="page-container">
      <div class="contain">
        <div class="col navvv">
          <div class="logo">
            <a href="{% url 'admin_page' %}" class="Logo"
              ><img
                class="logoimg"
                src="{% static 'upload/Logo Icon.png' %}"
                alt=""
            /></a>
          </div>

          <div class="col d-none d-sm-inline">
            <h1 class="admiindashh">ADMIN DASHBOARD</h1>
          </div>
          <div class="login">
            <a href="{% url 'logout' %}"
              ><button class="butttn">Logout</button></a
            >
          </div>
        </div>
      </div>
      <!-- Navbar Ends -->
      <main class="exhibition">
        <div class="textt">
          <h1 class="textttt">REGISTRATION LIST</h1>
        </div>
        <!-- showcase bar -->
        <div style="width: 95%" class="carddd">
          <div class="bgd">
            <ul>
              {% for registration in registrations %}
              <ul
                style="
                  margin-top: 10px;
                  margin-bottom: 10px;
                  padding-bottom: 10px;
                  border-bottom: 1px solid black;
                "
              >
                {% for name, value in registration.get_fields %}
                <li style="list-style: none">{{ name }}: {{ value }}</li>
                {% endfor %}
              </ul>
              {% empty %}
              <li>No registrations yet.</li>
              {% endfor %}
            </ul>
          </div>
          <div class="blobd"></div>
        </div>
        <!-- showcase bar -->

        <a href="{% url 'export_registrations' %}">
          <button class="downloadxls">Download Excel file</button>
        </a>
        <button
          id="clearBtn"
          class="downloadxls"
          style="background-color: red; margin: 20px; color: antiquewhite"
        >
          Clear Registration Records
        </button>
      </main>
      <footer class="fooot">
        <a href="{% url 'admin_page' %}"
          ><h1 style="font-size: 10px" class="goodzic">Home</h1></a
        >
      </footer>
    </div>
    <script>
      document
        .getElementById("clearBtn")
        .addEventListener("click", function () {
          if (confirm("Are you sure you want to clear all records?")) {
            fetch("{% url 'clear_registrations' %}", {
              method: "POST",
              headers: {
                "X-CSRFToken": getCookie("csrftoken"), // Django CSRF protection
                "Content-Type": "application/json",
              },
            })
              .then((response) => response.json())
              .then((data) => {
                alert(data.message);
              })
              .catch((error) => {
                alert("Error clearing model!");
                console.error(error);
              });
          }
        });

      // CSRF token helper (Django requirement)
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1)
              );
              break;
            }
          }
        }
        return cookieValue;
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
