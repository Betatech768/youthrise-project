{%load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
    />

    <link rel="stylesheet" href="{% static 'css/admincss.css' %}" />
  </head>
  <body>
    <!-- Navbar start -->
    <div class="page-container">
      {% include 'admin/nav.html' %}
      <!-- Navbar Ends -->
      <main class="exhibition">
        <div class="textt">
          <h1 class="textttt">NEWSLETTER REGISTRATION</h1>
        </div>

        <!-- showcase bar -->
        <div style="width: 95%" class="carddd">
          <div class="bgd">
            {% if newsletter %}
            <ul style="margin-top: 10px">
              {% for newsletter in newsletter %}
              <li style="list-style: none">{{ newsletter.email }} <br /></li>
              {% endfor %}
            </ul>
            {% else %}
            <p>No newsletter registrations have been made yet.</p>
            {% endif %}
          </div>
          <div class="blobd"></div>
        </div>
        <!-- showcase bar -->

        <a href="{% url 'export_newsletters' %}">
          <button class="downloadxls">Download Excel file</button>
        </a>
      </main>
      <footer class="fooot">
        <a href="{% url 'admin_page' %}"
          ><h1 style="font-size: 10px" class="goodzic">Home</h1></a
        >
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
