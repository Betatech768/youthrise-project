{%load static%}{% load humanize %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="{% static 'upload/YOUTHRISE-INTERNATIONAL.png' %}"
    />
    <link rel="stylesheet" href="{% static 'css/admincss.css' %}" />
  </head>
  <body>
    <!-- Navbar start -->
    <div style="margin-bottom: 100px">
      <div class="contain">
        <div class="contain">
          <div class="col navvv">
            <div class="logo">
              <a href="{% url 'admin_page' %}" class="Logo"
                ><img
                  class="logoimg"
                  src="{% static 'upload/Logo Icon.png' %}"
                  alt=""
              /></a>
            </div>

            <div class="col d-none d-sm-inline">
              <h1 class="admiindashh">ADMIN DASHBOARD</h1>
            </div>
            <div class="login">
              <a href="{% url 'logout' %}"
                ><button class="butttn">Logout</button></a
              >
            </div>
          </div>
        </div>
      </div>
      <!-- Navbar Ends -->
    </div>
    <!-- Navbar Ends -->
    <div class="container">
      <h3 class="move_middle">ADD SPONSORS PACKAGES</h3>

      <div class="move_middle">
        <div class="form-containerss">
          <form method="post" enctype="multipart/form-data" class="form">
            <div class="form-group">{% csrf_token %} {{ form.as_p }}</div>

            <button class="form-submit-btn" type="submit">Submit</button>
          </form>
        </div>
      </div>
      <hr />

      <h4
        style="
          font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS',
            sans-serif;
        "
        class="section-title"
      >
        SPONSORS PACKAGES
      </h4>
      <div class="pdf-list">
        {% for s in sponsors %}
        <div
          class="pdf-card"
          id="sponsor-{{ s.id }}"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
          "
        >
          <p>{{ s.name }} | &#8358;{{ s.price|intcomma }}</p>

          <!-- Delete button (AJAX) -->
          <button
            type="button"
            class="delete-btn"
            data-id="{{ s.id }}"
            style="
              padding: 8px 10px;
              width: 90px;
              margin-bottom: 10px;
              background-color: red;
              color: white;
              border: none;
              border-radius: 5px;
              cursor: pointer;
            "
          >
            Delete
          </button>
        </div>
        {% empty %}
        <p class="no-docs">No Sponsor Package added.</p>
        {% endfor %}
      </div>
    </div>
    <footer class="fooot">
      <a href="{% url 'admin_page' %}"
        ><h1 style="font-size: 10px" class="goodzic">Home</h1></a
      >
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Grab form elements
        const form = document.querySelector(".form");
        const inputs = form.querySelectorAll(
          "input[type='text'], input[type='file']"
        );
        const labels = form.querySelectorAll("label");
        const submitBtn = form.querySelector(".form-submit-btn");
        const pdf = document.getElementById("id_pdf");

        //   style the pdf section
        pdf.style.display = "block";
        pdf.style.margin = "10px 0";

        // Style the form container
        form.style.maxWidth = "500px";
        form.style.margin = "30px auto";
        form.style.padding = "20px";
        form.style.border = "1px solid #ddd";
        form.style.borderRadius = "12px";
        form.style.boxShadow = "0 4px 12px rgba(0,0,0,0.1)";
        form.style.background = "#fdfdfd";
        form.style.fontFamily = "Arial, sans-serif";

        // Style labels
        labels.forEach((label) => {
          label.style.display = "block";
          label.style.marginBottom = "6px";
          label.style.fontWeight = "bold";
          label.style.color = "#333";
        });

        // Style inputs
        inputs.forEach((input) => {
          input.style.width = "100%";
          input.style.padding = "10px";
          input.style.marginBottom = "16px";
          input.style.border = "1px solid #ccc";
          input.style.borderRadius = "6px";
          input.style.fontSize = "14px";
          input.style.transition = "border 0.3s ease, box-shadow 0.3s ease";

          // Hover & focus effects
          input.addEventListener("focus", () => {
            input.style.border = "1px solid #007bff";
            input.style.boxShadow = "0 0 6px rgba(0,123,255,0.4)";
          });
          input.addEventListener("blur", () => {
            input.style.border = "1px solid #ccc";
            input.style.boxShadow = "none";
          });
        });

        // Style submit button
        submitBtn.style.background = "#007bff";
        submitBtn.style.color = "#fff";
        submitBtn.style.padding = "12px 20px";
        submitBtn.style.border = "none";
        submitBtn.style.borderRadius = "8px";
        submitBtn.style.cursor = "pointer";
        submitBtn.style.fontSize = "16px";
        submitBtn.style.fontWeight = "bold";
        submitBtn.style.width = "100%";
        submitBtn.style.transition =
          "background 0.3s ease, transform 0.2s ease";

        submitBtn.addEventListener("mouseover", () => {
          submitBtn.style.background = "#000";
          submitBtn.style.transform = "scale(1.02)";
        });
        submitBtn.addEventListener("mouseout", () => {
          submitBtn.style.background = "#000";
          submitBtn.style.transform = "scale(1)";
        });
      });
    </script>
    <script>
      document.querySelectorAll(".delete-btn").forEach((button) => {
        button.addEventListener("click", function () {
          const sponsorId = this.dataset.id;
          fetch(`delete/${sponsorId}/`, {
            method: "POST",
            headers: {
              "X-CSRFToken": "{{ csrf_token }}",
            },
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                document.getElementById(`sponsor-${sponsorId}`).remove();
              }
            });
        });
      });
    </script>
  </body>
</html>
