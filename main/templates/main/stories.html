    <script>
      document
        .getElementById("sponsorForm")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // stop normal form submit

          const form = e.target;
          const url = form.action;
          const formData = new FormData(form);

          fetch(url, {
            method: "POST",
            body: formData,
            headers: {
              "X-Requested-With": "XMLHttpRequest", // tell Django this is AJAX
            },
          })
            .then((response) => response.json())
            .then((data) => {
              const msgDiv = document.getElementById("sponsorMessage");
              alert(data.message || "Story submitted successfully!");
              if (data.type === "success") {
                msgDiv.innerHTML = `<p style="color:green;">${data.message}</p>`;
                form.reset(); // clear the form
              } else if (data.type === "error") {
                msgDiv.innerHTML = `<p style="color:red;">${data.error}</p>`;

                // show field-specific errors
                if (data.elementErrors) {
                  for (const [field, info] of Object.entries(
                    data.elementErrors
                  )) {
                    alert(`${field}: ${info.errors.join(", ")}`);
                  }
                }
              }
            })
            .catch((err) => console.error("Error:", err));
        });
    </script>

    <script>
      document
        .getElementById("newsletter-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          let formData = new FormData(this);

          fetch(this.action, {
            method: "POST",
            body: formData,
            headers: {
              "X-Requested-With": "XMLHttpRequest",
            },
          })
            .then((response) => response.json())
            .then((data) => {
              let msg = document.getElementById("newsletter-message");
              if (data.type === "success") {
                msg.innerHTML = `<p style="color:green;">${data.message}</p>`;
              } else {
                let errorText = "";

                // If it's a dict of errors from Django
                if (data.errors) {
                  errorText = Object.values(data.errors).flat().join("<br>");
                } else if (data.message) {
                  // fallback if you later return a single error message
                  errorText = data.message;
                } else {
                  errorText = "An unexpected error occurred.";
                }

                msg.innerHTML = `<p style="color:red;">${errorText}</p>`;
              }
            });
          document.getElementById("clear").value = "";
        });
    </script>
    <script>
      const work = document.getElementById("id_content"); //dropdown
      const workSector = document.getElementById("id_specify_others"); //dropdown
      const workImpactSect = document.getElementById("id_specify_works"); // "Others" checkbox
      const workImpact = document.getElementById("id_work_impact"); //dropdown

      if (work && workSector) {
        const workSectWrapper = workSector.closest("p"); // parent <p> with label + input

        function toggleWorkSector() {
          if (work.value === "Others") {
            workSectWrapper.style.display = "block";
          } else {
            workSectWrapper.style.display = "none";
          }
        }

        // Run once on page load
        toggleWorkSector();

        // Re-check when work dropdown changes
        work.addEventListener("change", toggleWorkSector);
      }

      if (workImpact && workImpactSect) {
        const workImpactWrapper = workImpactSect.closest("p"); // parent <p> with label + input

        function specifyWorkImpactWrapperToggle() {
          if (workImpact.value === "9" || workImpact.value === "9") {
            workImpactWrapper.style.display = "block";
          } else {
            workImpactWrapper.style.display = "none";
          }
        }

        // Run once on page load
        specifyWorkImpactWrapperToggle();

        // Re-check when workImpact dropdown changes
        workImpact.addEventListener("change", specifyWorkImpactWrapperToggle);
      }
    </script>
