    <script>
      document
        .getElementById("newsletter-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          let formData = new FormData(this);

          fetch(this.action, {
            method: "POST",
            body: formData,
            headers: {
              "X-Requested-With": "XMLHttpRequest",
            },
          })
            .then((response) => response.json())
            .then((data) => {
              let msg = document.getElementById("newsletter-message");
              if (data.type === "success") {
                msg.innerHTML = `<p style="color:green;">${data.message}</p>`;
              } else {
                let errorText = "";

                // If it's a dict of errors from Django
                if (data.errors) {
                  errorText = Object.values(data.errors).flat().join("<br>");
                } else if (data.message) {
                  // fallback if you later return a single error message
                  errorText = data.message;
                } else {
                  errorText = "An unexpected error occurred.";
                }

                msg.innerHTML = `<p style="color:red;">${errorText}</p>`;
              }
            });
          document.getElementById("clear").value = "";
        });
    </script>
