    <script>
      const form = document.getElementById("sponsorForm");
      const button = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");

      form.addEventListener("submit", function (e) {
        e.preventDefault(); // stop normal submit for demo (remove if you want reload)

        // Change text + start blinking + disable
        btnText.textContent = "Submitting...";
        btnText.classList.add("blinking");
        button.disabled = true;

        // Simulate AJAX (replace with your fetch/axios call)
        setTimeout(() => {
          // stop blinking
          btnText.classList.remove("blinking");
          btnText.textContent = "Send";
          button.disabled = false; // re-enable if you want
        }, 3000);
      });
    </script>

    <script>
document.getElementById("sponsorForm").addEventListener("submit", function(e) {
    e.preventDefault(); // stop normal form submit

    const form = e.target;
    const url = form.action;
    const formData = new FormData(form);

    fetch(url, {
        method: "POST",
        body: formData,
        headers: {
            "X-Requested-With": "XMLHttpRequest" // tell Django this is AJAX
        }
    })
    .then(response => response.json())
    .then(data => {
        const msgDiv = document.getElementById("sponsorMessage");

        if (data.type === "success") {
            alert(data.message || "Registration successful! Thank you for Becoming a Sponsor.");
            msgDiv.innerHTML = `<p style="color:green;">${data.message}</p>`;
            form.reset(); // clear the form
        } else if (data.type === "error") {
            msgDiv.innerHTML = `<p style="color:red;">${data.error}</p>`;
            
            // show field-specific errors
            if (data.elementErrors) {
                for (const [field, info] of Object.entries(data.elementErrors)) {
                    alert(`${field}: ${info.errors.join(", ")}`);
                }
            }
        }
    })
    .catch(err => console.error("Error:", err));
});
</script>



<script>
document.getElementById("newsletter-form").addEventListener("submit", function(e) {
  e.preventDefault();

  let formData = new FormData(this);

  fetch(this.action, {
    method: "POST",
    body: formData,
    headers: {
      "X-Requested-With": "XMLHttpRequest"
    }
  })
  .then(response => response.json())
  .then(data => {
    let msg = document.getElementById("newsletter-message");
    if (data.type === "success") {
      msg.innerHTML = `<p style="color:green;">${data.message}</p>`;
    } else {
  let errorText = "";

  // If it's a dict of errors from Django
  if (data.errors) {
    errorText = Object.values(data.errors).flat().join("<br>");
  } else if (data.message) {
    // fallback if you later return a single error message
    errorText = data.message;
  } else {
    errorText = "An unexpected error occurred.";
  }

  msg.innerHTML = `<p style="color:red;">${errorText}</p>`;
}
  });
  document.getElementById("clear").value = "";
});
</script>
