version: "3.9"

services:
  web:
    build: .
    container_name: youthrise-web
    command: gunicorn youthrise_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  db:
    image: mysql:8.0
    container_name: youthrise-mysql
    restart: always
    environment:
      MYSQL_DATABASE: youthrise
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  nginx:
    image: nginx:latest
    container_name: youthrise-nginx
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/static
      - media_volume:/app/media

volumes:
  mysql_data:
  static_volume:
  media_volume:
